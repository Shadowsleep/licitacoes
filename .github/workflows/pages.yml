name: Validar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          npm run check
          node --check qa/cadastro.playwright.js
      - name: Preparar arquivos publicos
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          touch dist/.nojekyll
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
